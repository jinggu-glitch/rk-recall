# GitHub Actions CI for rk_recall / rk_recall 持续集成
# Tests on multiple Python versions to ensure portability.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy pytest pytest-cov

      - name: Install package
        run: |
          pip install -e . --no-deps

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run algorithm smoke test
        run: |
          python -c "
import numpy as np
from rk_recall import (
    rk4_integrate, rk4_with_recall,
    detect_limit_cycle, limit_cycle_distance,
    harmonic_oscillator, lorenz, van_der_pol,
)

# §3.26.16 honest smoke test: drift = min_{z in Gamma} ||y - z||
# (distance to attractor, NOT trajectory-vs-trajectory).
# Drift -> 0 as T_baseline -> infinity (Birkhoff ergodic + Poincare).

# Test 1: Harmonic oscillator — drift bounded (limit cycle = unit circle)
y0 = np.array([1.0, 0.0])
res = rk4_with_recall(harmonic_oscillator, y0, 0.0, 50.0, 0.1, recall_period=10)
print(f'Harmonic drift (final): {res.final_error:.2e}')
assert np.all(np.isfinite(res.y_array)), 'Harmonic produced non-finite values'
assert res.final_error < 0.1, f'Harmonic drift too large: {res.final_error}'

# Test 2: Lorenz (chaotic, no analytical solution) — finiteness + drift bounded
y0 = np.array([1.0, 1.0, 1.0])
res = rk4_with_recall(lorenz, y0, 0.0, 10.0, 0.01, recall_period=10)
print(f'Lorenz drift (final): {res.final_error:.2e}')
assert np.all(np.isfinite(res.y_array)), 'Lorenz produced non-finite values'

# Test 3: Van der Pol (no closed-form) — finiteness + drift bounded
y0 = np.array([2.0, 0.0])
res = rk4_with_recall(van_der_pol, y0, 0.0, 30.0, 0.05, recall_period=10)
print(f'Van der Pol drift (final): {res.final_error:.2e}')
assert np.all(np.isfinite(res.y_array)), 'Van der Pol produced non-finite values'

# Test 4: §3.26.16 drift convergence — longer T_baseline => smaller drift
# (time is on your side; honest asymptotic claim, NOT strict zero)
y0 = np.array([1.0, 1.0, 1.0])
base_short = rk4_integrate(lorenz, y0, 0.0, 50.0, 0.01)
gamma_short = detect_limit_cycle(base_short.t_array, base_short.y_array)
drift_short = float(np.max([
    limit_cycle_distance(y, gamma_short.cycle_points) for y in base_short.y_array[::50]
]))
base_long = rk4_integrate(lorenz, y0, 0.0, 200.0, 0.01)
gamma_long = detect_limit_cycle(base_long.t_array, base_long.y_array)
drift_long = float(np.max([
    limit_cycle_distance(y, gamma_long.cycle_points) for y in base_long.y_array[::50]
]))
print(f'Lorenz drift T=50:  {drift_short:.4e}')
print(f'Lorenz drift T=200: {drift_long:.4e}')
# §3.26.16: drift should NOT increase with longer baseline (ergodic densification)
assert drift_long <= drift_short * 1.5 + 1e-6, (
    f'§3.26.16 violated: drift grew with T_baseline ({drift_short} -> {drift_long})'
)

print('All smoke tests passed!')
"
