# ─────────────────────────────────────────────────────────────────────
# rk_recall — §3.26.16 Drift Convergence Theorem for Runge-Kutta
# PEP 517/518/621 compliant build specification.
# ─────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rk-recall"
version = "2.0.0"
description = "Drift Convergence Theorem for Runge-Kutta: ω-limit-set projection (§3.26.16) + Pyragas→Γ phase locking (§3.26.17). Drift → 0 as T_baseline → ∞."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rk-recall Contributors", email = "17319939601@163.com" },
]
requires-python = ">=3.9"
keywords = [
    "numerical-integration",
    "runge-kutta",
    "drift-convergence",
    "ergodic-theorem",
    "omega-limit-set",
    "limit-cycle",
    "pyragas-dfc",
    "phase-locking",
    "dynamical-systems",
    "no-oracle",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23,<3.0",
]

[project.optional-dependencies]
# §绘图功能依赖 matplotlib / Plotting depends on matplotlib
# §注: scipy 不再是依赖 (闭式 P* 定位纯 numpy 实现) / Note: scipy is no longer a dependency (closed-form P* is pure numpy)
plot = [
    "matplotlib>=3.6,<4.0",
]
# §开发工具链 / Development toolchain
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]
# §完整安装 (含所有可选依赖) / Full install (all optional deps)
all = [
    "matplotlib>=3.6,<4.0",
]

[project.urls]
Homepage = "https://github.com/jinggu-glitch/rk-recall"
Repository = "https://github.com/jinggu-glitch/rk-recall"
Documentation = "https://github.com/jinggu-glitch/rk-recall#readme"
"Bug Tracker" = "https://github.com/jinggu-glitch/rk-recall/issues"
Changelog = "https://github.com/jinggu-glitch/rk-recall/blob/main/CHANGELOG.md"

# ─── setuptools-specific discovery ───────────────────────────────────
[tool.setuptools]
packages = ["rk_recall"]
package-dir = { "rk_recall" = "." }
include-package-data = true

[tool.setuptools.package-data]
rk_recall = ["*.md", "*.txt", "py.typed"]

# ─── pytest configuration ────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::UserWarning:matplotlib.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests across multiple systems",
]

# ─── mypy static type checking ───────────────────────────────────────
[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# ─── ruff linter (replaces flake8/pylint) ────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument (dataclass default factory)
    "RUF001",# ambiguous unicode character (Chinese comments)
    "RUF002",# ambiguous unicode character docstring
    "RUF003",# ambiguous unicode character comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # test functions can have non-snake-case names

# ─── black formatter ─────────────────────────────────────────────────
[tool.black]
target-version = ["py39", "py310", "py311", "py312"]
line-length = 100
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
  | docs
)/
'''

# ─── isort import sorter ─────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["rk_recall"]
known_third_party = ["numpy", "matplotlib", "pytest"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ─── coverage configuration ──────────────────────────────────────────
[tool.coverage.run]
source = ["rk_recall"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__main__*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
show_missing = true
precision = 2
